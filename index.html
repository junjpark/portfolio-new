<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Justin — Portfolio</title>
<style>
  :root { --ink: #fffaf0; --muted: rgba(255,250,240,.78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #2b4646; color: var(--ink); font-family: ui-serif, Georgia, "Times New Roman", serif; }
  /* the background: fixed, behind everything, ignores the pointer */
  #river { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; display: block; }
  main { position: relative; z-index: 1; }
  .hero { min-height: 100vh; display: flex; align-items: center; padding: 0 clamp(20px, 6vw, 96px); }
  .hero-copy { max-width: min(560px, 42vw); }
  h1 { font-size: clamp(40px, 6vw, 84px); line-height: 1.02; margin: 0 0 22px; font-weight: 600; letter-spacing: -.01em; text-shadow: 0 1px 24px rgba(20,40,50,.25); }
  .lede { font: 400 clamp(16px, 1.4vw, 19px)/1.6 ui-sans-serif, system-ui, sans-serif; color: var(--muted); margin: 0 0 12px; max-width: 30em; }
  /* focus label: same treatment as the work board's kickers */
  .focus { font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 30px; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cta { display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1 ui-sans-serif, system-ui, sans-serif; color: #1f3434; background: #fffaf0; padding: 14px 22px; border-radius: 999px; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
  .cta:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(10,30,30,.25); }
  .cta svg { flex: none; }
  /* icon links: thin white ring like the reel arrow, frosted glass on hover */
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); color: #fff; display: grid; place-items: center;
    transition: background-color .25s ease, backdrop-filter .25s ease, -webkit-backdrop-filter .25s ease; }
  .icon-btn svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.3)); }
  .icon-btn:hover { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3); }
  .cta:focus-visible, .icon-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .icon-btn .logo { display: block; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.3)); }
  body.dark-text { --ink: #142628; --muted: rgba(20,38,40,.78); }
  body.dark-text h1 { text-shadow: 0 1px 24px rgba(255,250,235,.35); }
  body.dark-text .cta { background: #142628; color: #fffaf0; }
  body.no-text .hero-copy { visibility: hidden; }
  /* selected work: a masonry image board, small gutters, tight edges */
  .below { background: #f6f3ee; padding: clamp(14px, 2.4vw, 32px); min-height: 100vh; }
  .board { --gap: clamp(12px, 1.4vw, 20px); display: flex; align-items: flex-start; gap: var(--gap); }
  .board .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
  .tile { position: relative; display: block; overflow: hidden; background: #e7e2d9; color: #fff; text-decoration: none; }
  .tile img { display: block; width: 100%; height: auto; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .tile .ph { display: block; width: 100%; }
  /* hover: darken, show the project's kicker + title (only when the tile has them) */
  .tile .info { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px;
    background: rgba(30,34,34,.62); opacity: 0; transition: opacity .3s ease; }
  .tile .info small { font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .tile .info strong { font: 700 clamp(18px, 1.8vw, 24px)/1.2 ui-sans-serif, system-ui, sans-serif; }
  .tile.has-info:hover .info, .tile.has-info:focus-visible .info { opacity: 1; }
  .tile:hover img { transform: scale(1.03); }
  .tile:focus-visible { outline: 3px solid #e2b15a; outline-offset: 2px; }
  /* featured tile (e.g. my current project): a hairline ring + a quiet label */
  .tile.featured { box-shadow: 0 0 0 1.5px rgba(201,154,72,.85); }
  .tile .badge { position: absolute; top: 10px; left: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px 5px 8px; border-radius: 999px; background: rgba(28,30,30,.5); color: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font: 600 10px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .tile .badge i { width: 5px; height: 5px; border-radius: 50%; background: #e2b15a; }
  /* the reel-up arrow: a thin white ring + caret at the bottom of the hero; frosted glass on hover */
  .to-top { position: fixed; left: calc(50% - 24px); bottom: clamp(18px, 4vh, 40px); z-index: 20; width: 48px; height: 48px; padding: 0;
    border-radius: 50%; border: 1.5px solid rgba(255,255,255,.92); background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer;
    transition: background-color .25s ease, backdrop-filter .25s ease, -webkit-backdrop-filter .25s ease, opacity .35s ease, visibility .35s; }
  .to-top svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
  .to-top:hover, .to-top.rf-hooked { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3); }
  .to-top:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .to-top.away { opacity: 0; visibility: hidden; pointer-events: none; }
  @media (max-width: 720px) {
    .hero { align-items: flex-end; padding-bottom: 14vh; background: linear-gradient(to top, rgba(18,36,38,.55), rgba(18,36,38,0) 55%); }
    .hero-copy { max-width: 100%; }
  }
</style>
</head>
<body>
<canvas id="river" aria-hidden="true"></canvas>
<main>
  <section class="hero">
    <div class="hero-copy">
      <h1>Hi, I'm Justin.</h1>
      <p class="lede">I like building cool things.</p>
      <p class="focus">Backend · Cloud · AI</p>
      <div class="actions">
        <a class="cta" href="resume.pdf" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 3h7l5 5v12a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z M14 3v5h5 M9 13h7M9 17h5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
          View Resume
        </a>
        <a class="icon-btn" href="https://github.com/junjpark" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
          <img class="logo" src="icons/github.svg" alt="" width="20" height="20">
        </a>
        <a class="icon-btn" href="https://www.linkedin.com/in/junyoung-justin-park/" target="_blank" rel="noopener" aria-label="LinkedIn" title="LinkedIn">
          <img class="logo" src="icons/linkedin.png" alt="" width="19" height="18">
        </a>
        <a class="icon-btn" href="mailto:junjpark02@gmail.com" aria-label="Email" title="Email">
          <img class="logo" src="icons/mail.svg" alt="" width="20" height="20">
        </a>
      </div>
    </div>
  </section>
  <section class="below" id="work" aria-label="Selected work">
    <div class="board" id="board"></div>
  </section>
</main>
<button class="to-top" id="to-top" type="button" aria-label="See my work">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 14.5 12 8.5l6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

<script src="river-fisher.js"></script>
<script>
  // Your fun facts: every fact is caught once (in shuffled order) before any repeats.
  // Each fact is one appearance of its catch.
  RiverFisher.init(document.getElementById('river'), {
    facts: {
      fish: [],   // no plain fish: every catch is one of the treasures below
      jjajangmyeon: ['Jjajangmyeon is my favorite food, both to eat and to cook!'],
      bottle: ["I'm working on a food blog: recipe ideas, a food diary and more. Coming soon!"],
      viola: ["I played the viola for over 10 years, and my favorite piece I've played is the Debussy String Quartet!"],
      overwatch: ['I used to play Overwatch semi-professionally, ranking in the top 50 players in the US!'],
      tinikling: [{ text: 'I took a leap of faith and joined Tinikling last year, and it was my best decision in college! Watch us perform here.', linkText: 'Watch us perform here', link: 'https://www.youtube.com/watch?v=qcwGhEe47U8' }],
      hongkong: ["I'm currently studying AI/ML abroad in Hong Kong at HKUST!"],
    },
    // extra catches drawn from an image file (only appear once the file exists)
    catchImages: {
      overwatch: { src: 'catches/overwatch.svg', label: 'an Overwatch emblem', size: 36 },
    },
  });
  // Selected work: one entry per tile, in reading order (top-left → bottom-right). Add `src` (an image in work/),
  // and optionally a title, kicker, link (`href`) and `badge` (highlights the tile with a label).
  // Tiles without an image show as a soft placeholder at the given aspect ratio (w × h) so the layout is visible.
  const WORK = [
    { src: 'work/peoples-voice-dashboard.jpg', w: 2000, h: 1099, kicker: 'Data visualization', title: "People's Voice Survey Dashboard" },
    { src: 'work/mobility-project.jpg', w: 1920, h: 1080, kicker: 'WashU Digital Transformation', title: 'Mobility Project' },
    { src: 'work/tailor.jpg', w: 2000, h: 1124, kicker: 'AI-powered iOS app', title: 'tailor' },
    { src: 'work/grubu.jpg', w: 2000, h: 1250, kicker: 'iOS app', title: 'GrubU' },
    { src: 'work/win-probability-tree.png', w: 2000, h: 1125, kicker: 'Machine learning', title: 'League of Legends Game Review', badge: 'Current project' },
    { src: 'work/filipino-heritage-ar.jpg', w: 2000, h: 1121, kicker: 'Proof-of-concept proposal', title: 'Revitalizing Filipino Heritage Through AR' },
    { src: 'work/rebalance.jpg', w: 1688, h: 876, kicker: 'LLM API', title: 'ReBalance' },
    { src: 'work/leetcode-1v1.jpg', w: 1672, h: 888, kicker: 'Web app', title: 'LeetCode 1v1' },
    { src: 'work/cory.jpg', w: 1680, h: 904, kicker: 'Computer vision', title: 'cory' },
    // e.g. { src: 'work/blue-bee-hill.jpg', w: 1600, h: 1600, kicker: 'Linel', title: 'Blue Bee Hill', href: 'https://…' },
  ];
  (function renderBoard() {
    const board = document.getElementById('board');
    const tiles = [];
    const tones = ['#e4ddd2', '#dfe4dc', '#e7e0d6', '#dde2e4', '#e9e3da', '#e1ddd5', '#e5e1d7', '#dbe1dc', '#e8e2db'];
    WORK.forEach((it, i) => {
      const t = document.createElement(it.href ? 'a' : 'div');
      t.className = 'tile' + (it.title || it.kicker ? ' has-info' : '') + (it.badge ? ' featured' : '');
      if (it.href) { t.href = it.href; t.target = '_blank'; t.rel = 'noopener'; }
      if (it.src) {
        const img = new Image(); img.src = it.src; img.alt = it.title || ''; img.loading = 'lazy'; img.decoding = 'async';
        if (it.w && it.h) { img.width = it.w; img.height = it.h; }
        t.appendChild(img);
      } else {
        const ph = document.createElement('span'); ph.className = 'ph';
        ph.style.aspectRatio = (it.w || 1) + ' / ' + (it.h || 1); ph.style.background = tones[i % tones.length];
        t.appendChild(ph); t.setAttribute('aria-hidden', 'true');
      }
      if (it.title || it.kicker) {
        const info = document.createElement('span'); info.className = 'info';
        if (it.kicker) { const k = document.createElement('small'); k.textContent = it.kicker; info.appendChild(k); }
        if (it.title) { const s = document.createElement('strong'); s.textContent = it.title; info.appendChild(s); }
        t.appendChild(info);
      }
      if (it.badge) {
        const b = document.createElement('span'); b.className = 'badge';
        b.innerHTML = '<i aria-hidden="true"></i>'; b.append(it.badge); t.appendChild(b);
      }
      tiles.push({ el: t, ratio: (it.h || 1) / (it.w || 1) });
    });
    // deal tiles into columns left → right, row by row, so the board reads in WORK order
    let cols = 0;
    const layout = () => {
      const w = board.clientWidth, n = w >= 1000 ? 3 : w >= 600 ? 2 : 1;
      if (n === cols) return; cols = n;
      board.textContent = '';
      const colEls = [];
      for (let c = 0; c < n; c++) { const el = document.createElement('div'); el.className = 'col'; board.appendChild(el); colEls.push(el); }
      tiles.forEach((tl, i) => colEls[i % n].appendChild(tl.el));
    };
    layout(); window.addEventListener('resize', layout);
  })();
  // the arrow: he hooks it, struggles, and hauls the content below up into view
  const arrow = document.getElementById('to-top');
  // it belongs to the hero: fade it out once the content is in view
  const syncArrow = () => arrow.classList.toggle('away', window.scrollY > window.innerHeight * 0.35 && !arrow.classList.contains('rf-hooked'));
  window.addEventListener('scroll', syncArrow, { passive: true }); syncArrow();
  arrow.addEventListener('click', () => RiverFisher.reelUp(arrow, { to: document.getElementById('work') }).then(syncArrow));
</script>
</body>
</html>
