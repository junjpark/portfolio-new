<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>junjpark</title>
<style>
  :root { --ink: #fffaf0; --muted: rgba(255,250,240,.78); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #2b4646; color: var(--ink); font-family: ui-serif, Georgia, "Times New Roman", serif; }
  /* the background: fixed, behind everything, ignores the pointer */
  #river { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; pointer-events: none; display: block; }
  main { position: relative; z-index: 1; }
  .hero { min-height: 100vh; display: flex; align-items: center; padding: 0 clamp(20px, 6vw, 96px); }
  .hero-copy { max-width: min(560px, 42vw); }
  h1 { font-size: clamp(40px, 6vw, 84px); line-height: 1.02; margin: 0 0 22px; font-weight: 600; letter-spacing: -.01em; text-shadow: 0 1px 24px rgba(20,40,50,.25); }
  .lede { font: 400 clamp(16px, 1.4vw, 19px)/1.6 ui-sans-serif, system-ui, sans-serif; color: var(--muted); margin: 0 0 12px; max-width: 30em; }
  /* focus label: same treatment as the work board's kickers */
  .focus { font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 30px; }
  .actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cta { display: inline-flex; align-items: center; gap: 8px; font: 600 15px/1 ui-sans-serif, system-ui, sans-serif; color: #1f3434; background: #fffaf0; padding: 14px 22px; border-radius: 999px; text-decoration: none; transition: transform .2s ease, box-shadow .2s ease; }
  .cta:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(10,30,30,.25); }
  .cta svg { flex: none; }
  /* icon links: thin white ring like the reel arrow, frosted glass on hover */
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.9); color: #fff; display: grid; place-items: center;
    transition: background-color .25s ease, backdrop-filter .25s ease, -webkit-backdrop-filter .25s ease; }
  .icon-btn svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.3)); }
  .icon-btn:hover { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3); }
  .cta:focus-visible, .icon-btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .icon-btn .logo { display: block; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.3)); }
  /* top-right of the hero: "show all catches" + the sound icon and volume slider (plain icons with a drop shadow, no rings) */
  .hero { position: relative; }
  .scene-tools { position: absolute; top: clamp(14px, 2.4vw, 28px); right: clamp(14px, 2.6vw, 34px); z-index: 3; display: flex; align-items: center; gap: clamp(12px, 1.6vw, 20px);
    transition: opacity .25s ease, visibility .25s; }
  .catches-btn { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 15px 0 12px; border: 1.5px solid rgba(255,255,255,.9); border-radius: 999px;
    background: transparent; color: #fff; font: 600 14px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; text-shadow: 0 1px 3px rgba(0,0,0,.35);
    transition: background-color .25s ease, backdrop-filter .25s ease, -webkit-backdrop-filter .25s ease; }
  .catches-btn svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
  .catches-btn:hover { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3); }
  .sound { display: flex; align-items: center; gap: 8px; }
  .sound-btn { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 0; background: none; color: #fffaf0; cursor: pointer; }
  .sound-btn svg { display: block; width: 30px; height: 30px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)) drop-shadow(0 0 1px rgba(0,0,0,.3)); transition: transform .15s ease; }
  .sound-btn:hover svg { transform: scale(1.08); }
  .sound-btn .off, .sound-btn[aria-pressed="false"] .on { display: none; }
  .sound-btn[aria-pressed="false"] .off { display: block; }
  .sound input[type="range"] { -webkit-appearance: none; appearance: none; width: 86px; height: 22px; background: transparent; cursor: pointer; margin: 0; }
  .sound input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 99px; background: linear-gradient(to right, #fffaf0 var(--v, 80%), rgba(255,250,240,.35) var(--v, 80%)); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .sound input[type="range"]::-moz-range-track { height: 4px; border-radius: 99px; background: rgba(255,250,240,.35); box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .sound input[type="range"]::-moz-range-progress { height: 4px; border-radius: 99px; background: #fffaf0; }
  .sound input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: 50%; background: #fffaf0; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .sound input[type="range"]::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: #fffaf0; box-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .scene-tools :focus-visible { outline: 2px solid #fff; outline-offset: 3px; border-radius: 999px; }
  html.rf-focus .scene-tools { opacity: 0; visibility: hidden; pointer-events: none; }
  @media (max-width: 720px) { .catches-btn { height: 34px; padding: 0 12px 0 10px; font-size: 13px; } .sound input[type="range"] { width: 60px; } }
  /* every catch, one at a time, styled like the in-scene fact card */
  .catch-dialog { width: min(420px, calc(100vw - 32px)); padding: 0; border: 0; background: transparent; overflow: visible; color: #25302f; }
  .catch-dialog::backdrop { background: rgba(16, 32, 34, .45); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .catch-card { position: relative; background: #fffaf0; border-radius: 16px 18px 14px 18px; padding: 20px 22px 16px; box-shadow: 0 0 0 1.6px rgba(46,30,24,.8), 0 18px 44px rgba(16,36,40,.35);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; transform: rotate(-.8deg); }
  .catch-card .art { display: grid; place-items: center; height: 120px; margin: 0 0 10px; }
  .catch-card .kick { display: block; font: 700 11.5px/1.2 ui-sans-serif, system-ui, sans-serif; letter-spacing: .09em; text-transform: uppercase; color: #9a6430; margin: 0 0 6px; }
  .catch-card .text { margin: 0; min-height: 4.6em; }
  .catch-card .text a { color: #b4562c; font-weight: 600; text-underline-offset: 2px; }
  .catch-card .nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .catch-card .nav button { font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  .catch-card .prev { background: transparent; color: #25302f; border: 0; box-shadow: inset 0 0 0 1.4px rgba(46,30,24,.8); }
  .catch-card .next { background: #25302f; color: #fffaf0; border: 0; }
  .catch-card .dots { display: flex; gap: 6px; }
  .catch-card .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(46,30,24,.2); }
  .catch-card .dots i.on { background: #25302f; }
  .catch-card .close { position: absolute; top: 8px; right: 10px; width: 30px; height: 30px; border: 0; background: none; color: #5f5a52; font: 400 22px/1 ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  .catch-card button:focus-visible { outline: 2px solid #9a6430; outline-offset: 2px; }
  body.dark-text { --ink: #142628; --muted: rgba(20,38,40,.78); }
  body.dark-text h1 { text-shadow: 0 1px 24px rgba(255,250,235,.35); }
  body.dark-text .cta { background: #142628; color: #fffaf0; }
  body.no-text .hero-copy { visibility: hidden; }
  /* selected work: a masonry image board, small gutters, tight edges */
  .below { background: #f6f3ee; padding: clamp(14px, 2.4vw, 32px); min-height: 100vh; }
  .board { --gap: clamp(12px, 1.4vw, 20px); display: flex; align-items: flex-start; gap: var(--gap); }
  .board .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap); }
  .tile { position: relative; display: block; overflow: hidden; background: #e7e2d9; color: #fff; text-decoration: none; }
  .tile img { display: block; width: 100%; height: auto; transition: transform .6s cubic-bezier(.2,.7,.2,1); }
  .tile .ph { display: block; width: 100%; }
  /* hover: darken, show the project's kicker + title (only when the tile has them) */
  .tile .info { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 10px; padding: 24px;
    background: rgba(30,34,34,.62); opacity: 0; transition: opacity .3s ease; }
  .tile .info small { font: 600 13px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
  .tile .info strong { font: 700 clamp(18px, 1.8vw, 24px)/1.2 ui-sans-serif, system-ui, sans-serif; }
  .tile.has-info:hover .info, .tile.has-info:focus-visible .info { opacity: 1; }
  .tile:hover img { transform: scale(1.03); }
  .tile:focus-visible { outline: 3px solid #e2b15a; outline-offset: 2px; }
  /* featured tile (e.g. my current project): a hairline ring + a quiet label */
  .tile.featured { box-shadow: 0 0 0 1.5px rgba(201,154,72,.85); }
  .tile .badge { position: absolute; top: 10px; left: 10px; z-index: 2; display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 9px 5px 8px; border-radius: 999px; background: rgba(28,30,30,.5); color: rgba(255,255,255,.92);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    font: 600 10px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
  .tile .badge i { width: 5px; height: 5px; border-radius: 50%; background: #e2b15a; }
  /* the reel-up arrow: a thin white ring + caret at the bottom of the hero; frosted glass on hover */
  .to-top { position: fixed; left: calc(50% - 24px); bottom: clamp(18px, 4vh, 40px); z-index: 20; width: 48px; height: 48px; padding: 0;
    border-radius: 50%; border: 1.5px solid rgba(255,255,255,.92); background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer;
    transition: background-color .25s ease, backdrop-filter .25s ease, -webkit-backdrop-filter .25s ease, opacity .35s ease, visibility .35s; }
  .to-top svg { filter: drop-shadow(0 1px 1.5px rgba(0,0,0,.35)); }
  .to-top:hover, .to-top.rf-hooked { background: rgba(255,255,255,.14); -webkit-backdrop-filter: blur(10px) saturate(1.3); backdrop-filter: blur(10px) saturate(1.3); }
  .to-top:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .to-top.away { opacity: 0; visibility: hidden; pointer-events: none; }
  /* experience: two staggered columns of cover cards, each captioned "Org / role year" */
  .section-kicker { font: 700 12.5px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: #9a6430;
    margin: clamp(10px, 2vw, 24px) 0 clamp(14px, 2vw, 22px); }
  .xp { display: grid; grid-template-columns: 1fr 1fr; column-gap: clamp(16px, 2vw, 28px); align-items: start; margin-bottom: clamp(40px, 6vw, 88px); }
  .xp-col { display: flex; flex-direction: column; gap: clamp(28px, 3.4vw, 52px); }
  .xp-card { margin: 0; }
  .xp-art { position: relative; aspect-ratio: var(--r, 16 / 9); display: grid; place-items: center; overflow: hidden; padding: 24px; text-align: center;
    color: #fffaf0; font: 600 clamp(26px, 3.1vw, 46px)/1.1 ui-serif, Georgia, "Times New Roman", serif; letter-spacing: -.01em;
    text-shadow: 0 1px 18px rgba(30, 20, 10, .18); }
  .xp-art small { display: block; margin-top: 10px; font: 600 clamp(11px, .9vw, 13px)/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
  .xp-card figcaption { margin-top: 14px; font: 400 clamp(17px, 1.5vw, 22px)/1.35 ui-sans-serif, system-ui, sans-serif; color: #25302f; }
  .xp-card figcaption .sep, .xp-card figcaption .role { color: #9a948a; }
  .xp-card figcaption .sep { margin: 0 .3em; }
  .xp-card p { margin: 6px 0 0; max-width: 34em; font: 400 15px/1.55 ui-sans-serif, system-ui, sans-serif; color: #5f5a52; }
  .xp-card p a { color: #b4562c; text-underline-offset: 2px; }
  .xp-card p a:hover { color: #8a3f1e; }
  .xp-di2  { background: radial-gradient(70% 60% at 22% 18%, rgba(244, 199, 128, .75), transparent 60%), radial-gradient(60% 70% at 85% 90%, rgba(120, 190, 196, .8), transparent 65%), linear-gradient(150deg, #1d4850, #2f7279 55%, #4b98a0); }
  .xp-frb  { background: radial-gradient(60% 70% at 8% 0%, rgba(246, 214, 150, .9), transparent 60%), radial-gradient(55% 60% at 95% 95%, rgba(196, 140, 190, .75), transparent 65%), linear-gradient(120deg, #e7a14e, #d87a3c); }
  .xp-prox { background: radial-gradient(65% 60% at 80% 15%, rgba(244, 233, 196, .85), transparent 60%), radial-gradient(60% 70% at 10% 95%, rgba(92, 128, 92, .8), transparent 65%), linear-gradient(160deg, #8daa7c, #a9bf8c 50%, #7d9a6e); }
  .xp-tch  { background: radial-gradient(60% 60% at 85% 12%, rgba(240, 190, 140, .85), transparent 60%), radial-gradient(70% 70% at 0% 100%, rgba(90, 70, 120, .85), transparent 65%), linear-gradient(140deg, #7d6596, #b27f92 60%, #d79d86); }
  /* "fish on!": while a fish is hooked the scene takes over (river-fisher.js sets html.rf-focus and holds the scroll) */
  .hero-copy, .below { transition: opacity .25s ease, visibility .25s; }
  html.rf-focus .hero-copy, html.rf-focus .below, html.rf-focus .to-top { opacity: 0; visibility: hidden; pointer-events: none; }
  @media (max-width: 720px) {
    .hero { align-items: flex-end; padding-bottom: 14vh; background: linear-gradient(to top, rgba(18,36,38,.55), rgba(18,36,38,0) 55%); }
    .hero-copy { max-width: 100%; }
    .xp { grid-template-columns: 1fr; row-gap: 36px; }
    .xp-col { display: contents; }
    .xp-card { order: var(--o); }
  }
</style>
</head>

<script src="river-fisher.js"></script>
<script>
  // Your fun facts: every fact is caught once (in shuffled order) before any repeats.
  // Each fact is one appearance of its catch.
  // sound on by default; the speaker icon mutes it and the slider sets the level (both remembered in this browser)
  let muted = false, volume = 0.8;
  try { muted = localStorage.getItem('rf-muted') === '1'; const v = parseFloat(localStorage.getItem('rf-volume')); if (v >= 0 && v <= 1) volume = v; } catch (e) {}
  const FACTS = {
      fish: [],   // no plain fish: every catch is one of the treasures below
      jjajangmyeon: ['Jjajangmyeon is my favorite food, both to eat and to cook!'],
      bottle: ["I'm working on a food blog: recipe ideas, a food diary and more. Coming soon!"],
      viola: [{ text: "I played the viola for over 10 years, and my favorite piece I've played is the Debussy String Quartet! Watch my performance from high school!", linkText: 'Watch my performance from high school!', link: 'https://youtu.be/ywGgqLVlB9g' }],
      overwatch: ['I used to play Overwatch semi-professionally, ranking in the top 50 players in the US!'],
      tinikling: [{ text: 'I took a leap of faith and joined Tinikling last year, and it was my best decision in college! Watch us perform here.', linkText: 'Watch us perform here', link: 'https://www.youtube.com/watch?v=qcwGhEe47U8' }],
      hongkong: ["I'm currently studying AI/ML abroad in Hong Kong at HKUST!"],
  };
  // extra catches drawn from an image file (only appear once the file exists)
  const CATCH_IMAGES = {
    overwatch: { src: 'catches/overwatch.svg', label: 'an Overwatch emblem', size: 36 },
  };
  RiverFisher.init(document.getElementById('river'), {
    muted, volume, facts: FACTS, catchImages: CATCH_IMAGES,
    // sound files (played after the visitor's first click; anything missing falls back to the built-in synth)
    sounds: {
      nibble: { src: 'sounds/nibbles.m4a', slices: [0.5, 1.1, 1.68], dur: 0.42, vol: 0.45 },   // one little bite per nibble
      hook: 'sounds/bob-dip.mp3',                  // the fish takes it: the reel game starts
      cast: { src: 'sounds/cast.m4a', vol: 1.2 },          // the rod swings forward and the line whips out
      land: 'sounds/float-landing.mp3',            // the float lands on the water
      fight: { src: 'sounds/fish-fight.m4a', dur: 2, fade: 0.25 },   // loops while the fish fights
      escape: { src: 'sounds/escape.m4a', dur: 3.25, fade: 0.4, vol: 2 },   // the fish gets away (14 s to the end of the clip)
      reel: { src: 'sounds/reel-in.m4a', dur: 7, fade: 0.3, vol: 2.4 },   // loops while you hold to reel (quiet recording, boosted)
      release: { src: 'sounds/reel-release.m4a', fade: 0.2 },   // let go mid-fight: the reel unwinds
      fling: 'sounds/fling.m4a',                   // he wins: the catch flies up out of the water
      reveal: { src: 'sounds/catch-and-reveal.mp3', dur: 3.6 },   // he shows the catch off ("tada" rays)
      basket: 'sounds/put-in-basket.mp3',          // the catch goes into his creel
    },
  });
  (function soundControls() {
    const btn = document.getElementById('sound-btn'), range = document.getElementById('volume');
    const save = () => { try { localStorage.setItem('rf-muted', muted ? '1' : '0'); localStorage.setItem('rf-volume', String(volume)); } catch (e) {} };
    const show = () => {
      const off = muted || volume === 0;
      btn.setAttribute('aria-pressed', off ? 'false' : 'true'); btn.title = off ? 'Sound off' : 'Sound on';
      range.value = Math.round((muted ? 0 : volume) * 100); range.style.setProperty('--v', range.value + '%');
    };
    btn.addEventListener('click', () => {
      if (muted || volume === 0) { muted = false; if (volume === 0) volume = 0.6; RiverFisher.volume(volume); } else muted = true;
      RiverFisher.mute(muted); show(); save();
    });
    range.addEventListener('input', () => {
      volume = range.value / 100; muted = volume === 0;
      RiverFisher.volume(volume); RiverFisher.mute(muted); range.style.setProperty('--v', range.value + '%'); btn.setAttribute('aria-pressed', muted ? 'false' : 'true'); save();
    });
    show();
  })();
  // "Show all catches": click through every fun fact without fishing for it
  (function catchViewer() {
    const dlg = document.getElementById('catch-dialog'), card = dlg.querySelector('.catch-card');
    const art = card.querySelector('.art'), kick = card.querySelector('.kick'), text = card.querySelector('.text'), dots = card.querySelector('.dots');
    const list = [];
    for (const kind of Object.keys(FACTS)) for (const fact of FACTS[kind]) list.push({ kind, fact });
    const label = (kind) => RiverFisher.labelOf(kind) || (CATCH_IMAGES[kind] && CATCH_IMAGES[kind].label) || kind;
    dots.innerHTML = list.map(() => '<i></i>').join('');
    let i = 0;
    const setText = (f) => {   // a fact is a string, or { text, linkText, link }: the linkText part becomes a link
      text.textContent = '';
      const t = typeof f === 'string' ? f : f.text, lt = typeof f === 'object' && f.linkText, at = lt ? t.indexOf(lt) : -1;
      if (at < 0) { text.textContent = t; return; }
      const a = document.createElement('a'); a.href = f.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = lt;
      text.append(t.slice(0, at), a, t.slice(at + lt.length));
    };
    const render = () => {
      const c = list[i]; art.textContent = '';
      let pic = RiverFisher.catchArt(c.kind, 112);
      if (!pic && CATCH_IMAGES[c.kind]) { pic = new Image(); pic.src = CATCH_IMAGES[c.kind].src; pic.alt = ''; pic.width = 88; pic.height = 88; }
      if (pic) art.append(pic);
      kick.textContent = 'Catch ' + (i + 1) + ' of ' + list.length + ' · ' + label(c.kind);
      setText(c.fact);
      [...dots.children].forEach((d, k) => d.classList.toggle('on', k === i));
    };
    const go = (d) => { i = (i + d + list.length) % list.length; render(); };
    document.getElementById('catches-btn').addEventListener('click', () => { i = 0; render(); dlg.showModal(); card.querySelector('.next').focus(); });
    card.querySelector('.next').addEventListener('click', () => go(1));
    card.querySelector('.prev').addEventListener('click', () => go(-1));
    card.querySelector('.close').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });   // click outside the card
    dlg.addEventListener('keydown', (e) => { if (e.key === 'ArrowRight') { e.preventDefault(); go(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); } });
  })();
  // Selected work: one entry per tile, in reading order (top-left → bottom-right). Add `src` (an image in work/),
  // and optionally a title, kicker, link (`href`: a case study in projects/, or an external URL, which opens in a new tab) and `badge` (highlights the tile with a label).
  // Tiles without an image show as a soft placeholder at the given aspect ratio (w × h) so the layout is visible.
  const WORK = [
    { src: 'work/peoples-voice-dashboard.jpg', w: 2000, h: 1099, kicker: 'Data visualization', title: "People's Voice Survey Dashboard", href: 'projects/peoples-voice-dashboard.html' },
    { src: 'work/mobility-project.jpg', w: 1920, h: 1080, kicker: 'WashU Digital Transformation', title: 'Mobility Project', href: 'projects/mobility-project.html' },
    { src: 'work/tailor.jpg', w: 2000, h: 1124, kicker: 'AI-powered mobile app', title: 'tailor', badge: 'Hackathon winner', href: 'projects/tailor.html' },
    { src: 'work/grubu.jpg', w: 2000, h: 1250, kicker: 'iOS app', title: 'GrubU', href: 'projects/grubu.html' },
    { src: 'work/league-game-review.gif', w: 1200, h: 675, kicker: 'Machine learning', title: 'League of Legends Game Review', badge: 'Current project', href: 'projects/league-game-review.html' },
    { src: 'work/filipino-heritage-ar.jpg', w: 2000, h: 1121, kicker: 'Proof-of-concept proposal', title: 'Revitalizing Filipino Heritage Through AR', href: 'projects/filipino-heritage-ar.html' },
    { src: 'work/rebalance.jpg', w: 1688, h: 876, kicker: 'LLM API', title: 'ReBalance', badge: 'Hackathon winner', href: 'projects/rebalance.html' },
    { src: 'work/leetcode-1v1.jpg', w: 1672, h: 888, kicker: 'Web app', title: 'LeetCode 1v1', href: 'projects/leetcode-1v1.html' },
    { src: 'work/cory.jpg', w: 1680, h: 904, kicker: 'Computer vision', title: 'cory', href: 'projects/cory.html' },
    // e.g. { src: 'work/blue-bee-hill.jpg', w: 1600, h: 1600, kicker: 'Linel', title: 'Blue Bee Hill', href: 'https://…' },
  ];
  (function renderBoard() {
    const board = document.getElementById('board');
    const tiles = [];
    const tones = ['#e4ddd2', '#dfe4dc', '#e7e0d6', '#dde2e4', '#e9e3da', '#e1ddd5', '#e5e1d7', '#dbe1dc', '#e8e2db'];
    WORK.forEach((it, i) => {
      const t = document.createElement(it.href ? 'a' : 'div');
      t.className = 'tile' + (it.title || it.kicker ? ' has-info' : '') + (it.badge ? ' featured' : '');
      if (it.href) { t.href = it.href; if (/^https?:/.test(it.href)) { t.target = '_blank'; t.rel = 'noopener'; } }  // case studies open in the same tab
      if (it.src) {
        const img = new Image(); img.src = it.src; img.alt = it.title || ''; img.loading = 'lazy'; img.decoding = 'async';
        if (it.w && it.h) { img.width = it.w; img.height = it.h; }
        t.appendChild(img);
      } else {
        const ph = document.createElement('span'); ph.className = 'ph';
        ph.style.aspectRatio = (it.w || 1) + ' / ' + (it.h || 1); ph.style.background = tones[i % tones.length];
        t.appendChild(ph); t.setAttribute('aria-hidden', 'true');
      }
      if (it.title || it.kicker) {
        const info = document.createElement('span'); info.className = 'info';
        if (it.kicker) { const k = document.createElement('small'); k.textContent = it.kicker; info.appendChild(k); }
        if (it.title) { const s = document.createElement('strong'); s.textContent = it.title; info.appendChild(s); }
        t.appendChild(info);
      }
      if (it.badge) {
        const b = document.createElement('span'); b.className = 'badge';
        b.innerHTML = '<i aria-hidden="true"></i>'; b.append(it.badge); t.appendChild(b);
      }
      tiles.push({ el: t, ratio: (it.h || 1) / (it.w || 1) });
    });
    // deal tiles into columns left → right, row by row, so the board reads in WORK order
    let cols = 0;
    const layout = () => {
      const w = board.clientWidth, n = w >= 1000 ? 3 : w >= 600 ? 2 : 1;
      if (n === cols) return; cols = n;
      board.textContent = '';
      const colEls = [];
      for (let c = 0; c < n; c++) { const el = document.createElement('div'); el.className = 'col'; board.appendChild(el); colEls.push(el); }
      tiles.forEach((tl, i) => colEls[i % n].appendChild(tl.el));
    };
    layout(); window.addEventListener('resize', layout);
  })();
  // the arrow: he hooks it, struggles, and hauls the content below up into view
  const arrow = document.getElementById('to-top');
  // it belongs to the hero: fade it out once the content is in view
  const syncArrow = () => arrow.classList.toggle('away', window.scrollY > window.innerHeight * 0.35 && !arrow.classList.contains('rf-hooked'));
  window.addEventListener('scroll', syncArrow, { passive: true }); syncArrow();
  arrow.addEventListener('click', () => RiverFisher.reelUp(arrow, { to: document.getElementById('work') }).then(syncArrow));
</script>
